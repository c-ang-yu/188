/* ================= 逻辑 ================= */
const $ = id => document.getElementById(id);
let idx = 0;
let vec = [0,0,0,0,0,0];
let answered = [];
let orders = [];
let result = null;

function shuffle(n){
  const a = [...Array(n).keys()];
  for(let i = n - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function show(name){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $('view-' + name).classList.add('active');
  window.scrollTo(0, 0);
}

function cn(n){ return ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四'][n - 1] || n; }

function startQuiz(){
  idx = 0; vec = [0,0,0,0,0,0]; result = null;
  answered = new Array(Q.length).fill(null);
  orders = Q.map(() => shuffle(4));
  renderQ();
  show('quiz');
}

function renderQ(){
  const item = Q[idx];
  $('qbar').style.width = ((idx + 1) / Q.length * 100) + '%';
  $('qcount').textContent = (idx + 1) + ' / ' + Q.length;
  $('q-dim').textContent = '第 ' + cn(idx + 1) + ' 问 · ' + DIMS[item.dim].name.replace(/ /g,'');
  $('q-text').textContent = item.q;
  const box = $('q-opts');
  box.innerHTML = '';
  const letters = ['A','B','C','D'];
  orders[idx].forEach((oi, k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="key">' + letters[k] + '</span>' + item.o[oi].t;
    b.onclick = () => pick(oi, b);
    box.appendChild(b);
  });
}

function pick(oi, btn){
  if(btn.classList.contains('sel')) return;
  const o = Q[idx].o[oi];
  vec[Q[idx].dim] += o.s;
  answered[idx] = o;
  btn.classList.add('sel');
  setTimeout(() => {
    if(idx < Q.length - 1){ idx++; renderQ(); }
    else finish();
  }, 240);
}

$('btn-back').onclick = () => {
  if(idx > 0){
    const prev = answered[idx];
    if(prev){ vec[Q[idx].dim] -= prev.s; }
    idx--; renderQ();
  } else show('home');
};

function cosSim(u, c){
  let d = 0;
  for(let i = 0; i < 6; i++) d += u[i] * c[i];
  return d / (Math.hypot(...u) * Math.hypot(...c) || 1e-9);
}

function finish(){
  const entries = Object.entries(C).map(([k, c]) => [k, cosSim(vec, c.v)])
    .sort((a, b) => b[1] - a[1]);
  result = { ranked: entries, best: C[entries[0][0]], second: C[entries[1][0]] };
  renderResult();
  show('result');
}

function renderResult(){
  const { ranked, best, second } = result;
  $('r-name').textContent = best.n;
  $('r-title').textContent = best.t;
  $('r-line').textContent = '「 ' + best.q + ' 」';
  $('r-text').textContent = best.d;
  $('r-tags').innerHTML = best.tags.map(t => '<span class="chip">' + t + '</span>').join('');
  $('r-book').textContent = best.book + ' · ' + best.role;
  $('r-alt').innerHTML = '次像：<b>' + second.n + '</b> · ' + second.book.replace(/[《》]/g, '') + '的' + second.n;

  /* 六维剖析：黑条=你的维度得分位置，圆点=该人物坐标 */
  const box = $('r-bars');
  box.innerHTML = '';
  DIMS.forEach((dim, i) => {
    const upct = (vec[i] + 4) / 8 * 100;          /* -4..+4 → 0..100 */
    const cpct = (best.v[i] + 2) / 4 * 100;       /* -2..+2 → 0..100 */
    const row = document.createElement('div');
    row.className = 'dimrow';
    row.innerHTML =
      '<div class="dimtop"><span class="dimname">' + dim.name +
      '</span><span class="dimpole">' + dim.words[poleWord(vec[i])] + '</span></div>' +
      '<div class="dimtrack"><div class="dimfill" style="width:0" data-w="' + upct + '"></div>' +
      '<div class="dimmark" style="left:0" data-left="' + cpct + '"></div></div>';
    box.appendChild(row);
  });
  $('r-legend').innerHTML = '<span>◄ ' + best.t + '</span><span>■ 你的位置 · ● ' + best.n + '</span>';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    box.querySelectorAll('.dimfill').forEach(f => f.style.width = f.dataset.w + '%');
    box.querySelectorAll('.dimmark').forEach(m => m.style.left = m.dataset.left + '%');
  }));
}

/* 复制结果 */
$('btn-copy').onclick = () => {
  const { best } = result;
  const dims = DIMS.map((d, i) => d.name.replace(/ /g,'') + '·' + d.words[poleWord(vec[i])]).join('｜');
  const text = '【测测你是188男团里的谁】\n我测出了：' + best.n + ' · ' + best.t +
    '\n「' + best.q + '」\n六维：' + dims;
  const done = () => toast('已复制，快去分享吧');
  /* execCommand 同步可靠（用户手势内），失败再退 clipboard API */
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  if(ok){ done(); }
  else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => toast('复制失败，请手动截图'));
  } else toast('复制失败，请手动截图');
};

let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 1800);
}

/* 绑定 */
$('btn-start').onclick = startQuiz;
$('btn-retry').onclick = startQuiz;
</script>
